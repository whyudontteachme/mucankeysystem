<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mucan Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container admin-container">
        <!-- Login -->
        <div id="login-section" class="card login-box">
            <h1>🔐 Admin Login</h1>
            <p class="subtitle">Masukkan admin token</p>
            <input type="password" id="admin-token" placeholder="Admin Token" 
                   style="width: 100%; padding: 14px; border-radius: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,170,255,0.3); color: #fff; font-size: 14px; margin: 15px 0; outline: none;">
            <button id="btn-login" class="btn btn-primary" style="width: 100%;">Login</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" class="admin-card hidden">
            <div class="admin-header">
                <h1>📊 License Dashboard</h1>
                <div>
                    <button id="btn-refresh" class="btn btn-small btn-success">🔄 Refresh</button>
                    <button id="btn-logout" class="btn btn-small btn-danger">🚪 Logout</button>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="label">Total</div>
                    <div class="value" id="stat-total">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Active</div>
                    <div class="value" id="stat-active" style="color: #00ff64;">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Pending</div>
                    <div class="value" id="stat-pending" style="color: #ffc800;">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Revoked</div>
                    <div class="value" id="stat-revoked" style="color: #ff5050;">0</div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User ID</th>
                        <th>HWID</th>
                        <th>Key</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="license-table">
                    <tr><td colspan="7" style="text-align: center; color: #888;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let adminToken = null;

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('mucan_admin_token');
            if (saved) {
                adminToken = saved;
                loadDashboard();
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const token = document.getElementById('admin-token').value;
            if (!token) return alert('Masukkan token!');
            adminToken = token;
            localStorage.setItem('mucan_admin_token', token);
            loadDashboard();
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('mucan_admin_token');
            location.reload();
        });

        document.getElementById('btn-refresh').addEventListener('click', loadDashboard);

        async function loadDashboard() {
            try {
                const res = await fetch('/admin/licenses', {
                    headers: { 'x-admin-token': adminToken }
                });
                
                if (res.status === 401) {
                    alert('Token salah!');
                    localStorage.removeItem('mucan_admin_token');
                    location.reload();
                    return;
                }
                
                const data = await res.json();
                if (data.status !== 'ok') return alert('Error: ' + data.message);
                
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                renderDashboard(data.data);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function renderDashboard(licenses) {
            const stats = { total: 0, active: 0, pending: 0, revoked: 0 };
            licenses.forEach(l => {
                stats.total++;
                if (stats[l.status] !== undefined) stats[l.status]++;
            });
            
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-active').textContent = stats.active;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-revoked').textContent = stats.revoked;
            
            const tbody = document.getElementById('license-table');
            if (licenses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #888;">Belum ada license</td></tr>';
                return;
            }
            
            tbody.innerHTML = licenses.map(l => `
                <tr>
                    <td>${l.id}</td>
                    <td class="mono">${l.user_id}</td>
                    <td class="mono">${(l.hwid || '').substring(0, 20)}...</td>
                    <td class="mono">${l.license_key}</td>
                    <td><span class="badge ${l.status}">${l.status}</span></td>
                    <td>${new Date(l.created_at).toLocaleString('id-ID')}</td>
                    <td>
                        ${l.status !== 'active' ? `<button class="btn btn-small btn-success" onclick="activateLicense(${l.id})">✅</button>` : ''}
                        ${l.status !== 'revoked' ? `<button class="btn btn-small btn-danger" onclick="revokeLicense(${l.id})">🚫</button>` : ''}
                        <button class="btn btn-small btn-danger" onclick="deleteLicense(${l.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function activateLicense(id) {
            if (!confirm('Aktifkan license #' + id + '?')) return;
            await fetch(`/admin/activate/${id}`, {
                method: 'POST',
                headers: { 'x-admin-token': adminToken }
            });
            loadDashboard();
        }

        async function revokeLicense(id) {
            if (!confirm('Revoke license #' + id + '?')) return;
            await fetch(`/admin/revoke/${id}`, {
                method: 'POST',
                headers: { 'x-admin-token': adminToken }
            });
            loadDashboard();
        }

        async function deleteLicense(id) {
            if (!confirm('HAPUS PERMANEN license #' + id + '?')) return;
            await fetch(`/admin/delete/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': adminToken }
            });
            loadDashboard();
        }
    </script>
</body>
</html>
